<script>
    // Safe storage wrapper to prevent crashes if localStorage is blocked or disabled
    const safeStorage = {
        getItem(key, fallback) {
            try {
                const item = localStorage.getItem(key);
                return item !== null ? JSON.parse(item) : fallback;
            } catch (e) {
                return fallback;
            }
        },
        setItem(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                // Fallback silently if storage is blocked
            }
        }
    };

    // Structured Catalog with strict pagination limits
    const CATALOG = [
        { id: "vid1", title: "Cyberpunk 2077 Night City Ambient Mix - Neon Dreams", uploader: "CyberVibes", thumbnail: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=640&q=80", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" },
        { id: "vid2", title: "Building an Autonomous AI Agent in 2026", uploader: "DevPulse", thumbnail: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=640&q=80", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
        { id: "vid3", title: "Synthwave Radio - Chill Beats to Hack/Code To", uploader: "NeonStream", thumbnail: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=640&q=80", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
        { id: "vid4", title: "Future Tech: Quantum Computing Breakthroughs Explained", uploader: "Sciencenode", thumbnail: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=640&q=80", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
        { id: "vid5", title: "Deep Dive into Sci-Fi UI/UX Architecture", uploader: "CyberVibes", thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=640&q=80", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
        { id: "vid6", title: "Retro-Futurism & The Aesthetics of 80s Terminals", uploader: "DevPulse", thumbnail: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=640&q=80", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" }
    ];

    let appSettings = safeStorage.getItem('umatte_settings', { autoRotate: true, gesturesEnabled: true });
    let userSubscriptions = safeStorage.getItem('umatte_subs', []);
    let userPlaylists = safeStorage.getItem('umatte_playlists', {"Favorites": []});
    let currentVideoData = null;
    let activeTab = 'trending';

    function saveUserData() {
        safeStorage.setItem('umatte_subs', userSubscriptions);
        safeStorage.setItem('umatte_playlists', userPlaylists);
        safeStorage.setItem('umatte_settings', appSettings);
    }

    function loadSettings() {
        document.getElementById('setting-autorotate').checked = appSettings.autoRotate;
        document.getElementById('setting-gestures').checked = appSettings.gesturesEnabled;
    }

    const feedView = document.getElementById('feed-view');
    const playerView = document.getElementById('player-view');
    const settingsView = document.getElementById('settings-view');
    const videoGrid = document.getElementById('video-grid');
    const recommendationsGrid = document.getElementById('recommendations-grid');
    const mainVideo = document.getElementById('main-video');
    const playerWrapper = document.getElementById('player-wrapper');
    const watchTitle = document.getElementById('watch-title');
    const watchChannel = document.getElementById('watch-channel');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const backToFeedBtn = document.getElementById('back-to-feed');
    const verticalToggleBtn = document.getElementById('vertical-toggle-btn');
    const subscribeBtn = document.getElementById('subscribe-btn');
    const addPlaylistBtn = document.getElementById('add-playlist-btn');
    const hudDisplay = document.getElementById('hud-display');
    const feedTitle = document.getElementById('feed-title');
    const settingsOpenBtn = document.getElementById('settings-open-btn');
    const settingsBackBtn = document.getElementById('settings-back-btn');
    const logoHome = document.getElementById('logo-home');
    const navTabs = document.querySelectorAll('.tab-btn');

    let isVerticalMode = false;

    function switchView(viewName) {
        feedView.style.display = viewName === 'feed' ? 'block' : 'none';
        playerView.style.display = viewName === 'player' ? 'block' : 'none';
        settingsView.style.display = viewName === 'settings' ? 'block' : 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderGrid(items, container, append = false) {
        if (!append) container.innerHTML = '';
        const safeItems = (items || []).slice(0, 16);
        
        if (safeItems.length === 0) {
            if (!append) container.innerHTML = '<div class="loader">No items found in this feed.</div>';
            return;
        }
        
        safeItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = \`
                <div class="thumbnail-container">
                    <img src="${item.thumbnail}" alt="${item.title}" loading="lazy">
                </div>
                <div class="video-info">
                    <div class="video-title">${item.title}</div>
                    <div class="video-channel">${item.uploader}</div>
                </div>
            \`;
            card.addEventListener('click', () => playVideo(item));
            container.appendChild(card);
        });
    }

    function loadTrending() {
        feedTitle.innerText = "Trending Feed";
        renderGrid(CATALOG, videoGrid);
    }

    function loadSubscriptions() {
        feedTitle.innerText = "Your Subscriptions Feed";
        if (userSubscriptions.length === 0) {
            videoGrid.innerHTML = '<div class="loader">No subscriptions saved yet. Open a video and hit Subscribe!</div>';
            return;
        }
        const subVideos = CATALOG.filter(v => userSubscriptions.includes(v.uploader));
        renderGrid(subVideos, videoGrid);
    }

    function loadDiscoverFeed() {
        feedTitle.innerText = "✨ Discover Feed";
        const discoverVideos = CATALOG.filter(v => !userSubscriptions.includes(v.uploader));
        renderGrid(discoverVideos, videoGrid);
    }

    function loadPlaylistsView() {
        feedTitle.innerText = "Your Saved Playlists";
        videoGrid.innerHTML = '';
        const playlistNames = Object.keys(userPlaylists);
        if (playlistNames.length === 0 || playlistNames.every(p => userPlaylists[p].length === 0)) {
            videoGrid.innerHTML = '<div class="loader">No saved videos in playlists yet.</div>';
            return;
        }
        playlistNames.forEach(name => {
            const vids = userPlaylists[name];
            if (vids && vids.length > 0) {
                const header = document.createElement('h3');
                header.style.gridColumn = "1 / -1";
                header.style.marginTop = "10px";
                header.style.color = "var(--accent-color)";
                header.innerText = \`📂 ${name} (${vids.length} videos)\`;
                videoGrid.appendChild(header);
                renderGrid(vids, videoGrid, true);
            }
        });
    }

    function performSearch(query) {
        if (!query.trim()) return;
        switchView('feed');
        feedTitle.innerText = \`Search Results for "${query}"\`;
        const results = CATALOG.filter(v => v.title.toLowerCase().includes(query.toLowerCase()) || v.uploader.toLowerCase().includes(query.toLowerCase()));
        renderGrid(results, videoGrid);
    }

    function playVideo(item) {
        switchView('player');
        currentVideoData = item;
        watchTitle.innerText = item.title;
        watchChannel.innerText = item.uploader;

        const isSubbed = userSubscriptions.includes(item.uploader);
        subscribeBtn.innerText = isSubbed ? "✓ Subscribed" : "⭐ Subscribe";

        mainVideo.src = item.videoUrl;
        mainVideo.load();

        const recs = CATALOG.filter(v => v.id !== item.id);
        renderGrid(recs, recommendationsGrid);
    }

    subscribeBtn.addEventListener('click', () => {
        if (!currentVideoData) return;
        const uploader = currentVideoData.uploader;
        const index = userSubscriptions.indexOf(uploader);
        if (index > -1) {
            userSubscriptions.splice(index, 1);
            subscribeBtn.innerText = "⭐ Subscribe";
        } else {
            userSubscriptions.push(uploader);
            subscribeBtn.innerText = "✓ Subscribed";
        }
        saveUserData();
    });

    addPlaylistBtn.addEventListener('click', () => {
        if (!currentVideoData) return;
        const playlistName = prompt("Enter playlist name:", "Favorites");
        if (!playlistName) return;

        if (!userPlaylists[playlistName]) userPlaylists[playlistName] = [];
        
        if (!userPlaylists[playlistName].some(v => v.id === currentVideoData.id)) {
            userPlaylists[playlistName].push(currentVideoData);
            saveUserData();
            alert(\`Added to playlist "${playlistName}"!\`);
        } else {
            alert("Video is already in this playlist.");
        }
    });

    mainVideo.addEventListener('play', () => {
        if (appSettings.autoRotate && !isVerticalMode) {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }
    });

    verticalToggleBtn.addEventListener('click', () => {
        isVerticalMode = !isVerticalMode;
        if (isVerticalMode) {
            playerWrapper.classList.add('vertical-mode');
            verticalToggleBtn.classList.add('active');
            verticalToggleBtn.innerText = "🖥️ Landscape Mode Toggle";
            if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
        } else {
            playerWrapper.classList.remove('vertical-mode');
            verticalToggleBtn.classList.remove('active');
            verticalToggleBtn.innerText = "📱 Vertical Mode Toggle";
            if (appSettings.autoRotate && screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }
    });

    let touchStartY = 0;
    let startVolume = 1;
    let hudTimeout;

    function showHUD(text) {
        hudDisplay.innerText = text;
        hudDisplay.classList.add('show');
        clearTimeout(hudTimeout);
        hudTimeout = setTimeout(() => { hudDisplay.classList.remove('show'); }, 800);
    }

    playerWrapper.addEventListener('touchstart', (e) => {
        if (!appSettings.gesturesEnabled) return;
        if (e.touches.length === 1) {
            touchStartY = e.touches[0].clientY;
            startVolume = mainVideo.volume;
        }
    }, {passive: true});

    playerWrapper.addEventListener('touchmove', (e) => {
        if (!appSettings.gesturesEnabled) return;
        if (e.touches.length === 1) {
            const touchY = e.touches[0].clientY;
            const touchX = e.touches[0].clientX;
            const diffY = touchStartY - touchY;
            const rect = playerWrapper.getBoundingClientRect();
            if (touchX > rect.width / 2) {
                let newVol = startVolume + (diffY / rect.height);
                newVol = Math.max(0, Math.min(1, newVol));
                mainVideo.volume = newVol;
                showHUD(\`Volume: ${Math.round(newVol * 100)}%\`);
            }
        }
    }, {passive: true});

    let lastTapTime = 0;
    playerWrapper.addEventListener('click', (e) => {
        if (!appSettings.gesturesEnabled) return;
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;
        const rect = playerWrapper.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        if (tapLength < 300 && tapLength > 0) {
            if (clickX > rect.width / 2) {
                mainVideo.currentTime = Math.min(mainVideo.duration, mainVideo.currentTime + 10);
                showHUD("+10s");
            } else {
                mainVideo.currentTime = Math.max(0, mainVideo.currentTime - 10);
                showHUD("-10s");
            }
        }
        lastTapTime = currentTime;
    });

    navTabs.forEach(btn => {
        btn.addEventListener('click', () => {
            navTabs.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeTab = btn.getAttribute('data-tab');
            switchView('feed');
            if (activeTab === 'trending') loadTrending();
            else if (activeTab === 'subscriptions') loadSubscriptions();
            else if (activeTab === 'discover') loadDiscoverFeed();
            else if (activeTab === 'playlists') loadPlaylistsView();
        });
    });

    logoHome.addEventListener('click', () => { 
        navTabs.forEach(b => b.classList.remove('active'));
        document.querySelector('[data-tab="trending"]').classList.add('active');
        switchView('feed'); 
        loadTrending(); 
    });

    backToFeedBtn.addEventListener('click', () => {
        mainVideo.pause();
        mainVideo.src = '';
        switchView('feed');
        if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
    });

    settingsOpenBtn.addEventListener('click', () => switchView('settings'));
    settingsBackBtn.addEventListener('click', () => {
        appSettings.autoRotate = document.getElementById('setting-autorotate').checked;
        appSettings.gesturesEnabled = document.getElementById('setting-gestures').checked;
        saveUserData();
        switchView('feed');
    });

    document.getElementById('export-data-btn').addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ subscriptions: userSubscriptions, playlists: userPlaylists }));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "umatte_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    });

    searchBtn.addEventListener('click', () => performSearch(searchInput.value));
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(searchInput.value); });

    // Initialize UI safely
    loadSettings();
    loadTrending();
</script>
